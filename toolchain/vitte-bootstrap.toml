schema = "vitte.bootstrap.config.v1"
config_format_version = "1"

[seed]
artifact = "toolchain/seed/vittec0.seed"
source = "toolchain/seed/src/main.vit"
manifest = "toolchain/seed/manifest.txt"
sha256 = "82a546324007964ae98a9b0666bd5ffb8c3a0dab8c8fd3004ae0d5dc932251f2"

[compiler]
root = "src/vitte/compiler"
entry = "src/vitte/compiler/main.vit"
driver = "bin/vitte"
stage0 = "bin/vittec0"
stage1 = "target/bootstrap/stage1/vitte"
stage2 = "target/bootstrap/stage2/vitte"

[stdlib]
root = "src/vitte/stdlib"
core = "src/vitte/stdlib/core/index.vit"
alloc = "src/vitte/stdlib/alloc/index.vit"
std = "src/vitte/stdlib/std/index.vit"
profile = "full"
modules = [
  "src/vitte/stdlib/alloc/index.vit",
  "src/vitte/stdlib/async/index.vit",
  "src/vitte/stdlib/benchmarks/index.vit",
  "src/vitte/stdlib/collections/index.vit",
  "src/vitte/stdlib/compression/index.vit",
  "src/vitte/stdlib/core/index.vit",
  "src/vitte/stdlib/crypto/index.vit",
  "src/vitte/stdlib/data/index.vit",
  "src/vitte/stdlib/encoding/index.vit",
  "src/vitte/stdlib/examples/index.vit",
  "src/vitte/stdlib/experimental/index.vit",
  "src/vitte/stdlib/ffi/index.vit",
  "src/vitte/stdlib/generated/index.vit",
  "src/vitte/stdlib/io/index.vit",
  "src/vitte/stdlib/json/index.vit",
  "src/vitte/stdlib/kernel/index.vit",
  "src/vitte/stdlib/math/index.vit",
  "src/vitte/stdlib/network/index.vit",
  "src/vitte/stdlib/path/index.vit",
  "src/vitte/stdlib/platform/index.vit",
  "src/vitte/stdlib/profiling/index.vit",
  "src/vitte/stdlib/std/index.vit",
  "src/vitte/stdlib/tests/index.vit",
  "src/vitte/stdlib/threading/index.vit",
  "src/vitte/stdlib/tools/index.vit",
]
required_entrypoints = [
  "src/vitte/stdlib/core/index.vit",
  "src/vitte/stdlib/alloc/index.vit",
  "src/vitte/stdlib/std/index.vit",
]

[bootstrap]
target_dir = "target/bootstrap"
reproducible = true
offline = true
verify_stdlib = true
verify_compiler = true
verify_stage_chain = true
