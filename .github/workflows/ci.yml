name: Vitte CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vitte-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler-runtime:
    name: Compiler and runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install compiler dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            gdb

      - name: Build compiler
        run: make -j2

      - name: Diagnose Linux native fixture
        run: |
          set +e
          gdb -q -batch \
            -ex 'set pagination off' \
            -ex run \
            -ex 'bt full' \
            --args build/bin/vitte \
              compile src/tests/grammar_alignment/let_mut_ok.vit \
              -o build/ci-native
          compile_exit=$?
          printf 'compiler_exit=%s\n' "$compile_exit"
          if test "$compile_exit" -eq 0; then
            gdb -q -batch \
              -ex run \
              -ex bt \
              --args build/ci-native
            printf 'native_exit=%s\n' "$?"
          fi
          exit 0

      - name: Run compiler test suite
        run: make test

      - name: Run runtime tests
        run: make test-runtime

  extension-dap:
    name: Extension and native DAP
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out VS Code extension
        uses: actions/checkout@v4
        with:
          repository: vitte-lang/VitteLangVsCode
          ref: main
          path: vscode/VitteLangVsCode-main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode/VitteLangVsCode-main/package-lock.json

      - name: Install extension and DAP dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            clang \
            expect \
            lldb \
            xvfb

      - name: Install extension dependencies
        working-directory: vscode/VitteLangVsCode-main
        run: npm ci

      - name: Build compiler for native DAP
        run: make -j2

      - name: Run extension and native DAP tests
        working-directory: vscode/VitteLangVsCode-main
        run: xvfb-run --auto-servernum --server-args='-screen 0 1280x1024x24' npm test
