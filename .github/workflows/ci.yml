name: Vitte CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vitte-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler-runtime:
    name: Compiler and runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install compiler dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential

      - name: Build compiler
        run: make -j2

      - name: Run compiler test suite
        run: make test

      - name: Run runtime tests
        run: make test-runtime

  extension-dap:
    name: Extension and native DAP
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out VS Code extension
        uses: actions/checkout@v4
        with:
          repository: vitte-lang/VitteLangVsCode
          ref: main
          path: vscode/VitteLangVsCode

      - name: Check out Vitte source tree for extension imports
        uses: actions/checkout@v4
        with:
          repository: vitte-lang/vitte_archive
          ref: 53ebaa0c203d7301062f943f38115704c9b4f14b
          path: vscode/src/vitte

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode/VitteLangVsCode/package-lock.json

      - name: Install extension and DAP dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            clang \
            expect \
            lldb \
            xvfb

      - name: Install extension dependencies
        working-directory: vscode/VitteLangVsCode
        run: npm ci

      - name: Generate extension imports from Vitte source tree
        working-directory: vscode/VitteLangVsCode
        run: npm run generate:imports

      - name: Build compiler for native DAP
        run: make -j2

      - name: Run extension and native DAP tests
        working-directory: vscode/VitteLangVsCode
        run: xvfb-run --auto-servernum --server-args='-screen 0 1280x1024x24' npm test
