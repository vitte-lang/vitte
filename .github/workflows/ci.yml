name: Vitte CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vitte-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  complete:
    name: Complete build and test suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode/VitteLangVsCode-main/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install native and VS Code test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            clang \
            expect \
            lldb \
            xvfb

      - name: Install extension dependencies
        working-directory: vscode/VitteLangVsCode-main
        run: npm ci

      - name: Build compiler
        run: make -j2

      - name: Run compiler test suite
        run: make test

      - name: Run runtime tests
        run: make test-runtime

      - name: Run extension and native DAP tests
        working-directory: vscode/VitteLangVsCode-main
        run: xvfb-run --auto-servernum --server-args='-screen 0 1280x1024x24' npm test
