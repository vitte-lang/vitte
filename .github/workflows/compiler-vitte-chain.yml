name: compiler-vitte-chain

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  compiler-vitte-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run mandatory seed-free release gate
        run: make seed-free-release-gate

      - name: Index reports
        if: always()
        run: make reports-index

      - name: Upload selfhost reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-vitte-chain-reports
          path: |
            target/reports/selfhost_*_gate.json
            target/reports/selfhost_*_gate.md
            target/reports/selfhost_stage_compare_gate.json
            target/reports/selfhost_stage_compare_gate.md
            target/reports/release_binary_gate.json
            target/reports/release_binary_gate.md
            target/reports/release_clean_selfhost_gate.json
            target/reports/release_clean_selfhost_gate.md
            target/reports/release_package_stdlib_gate.json
            target/reports/release_package_stdlib_gate.md
            target/reports/stdlib_total_gate.json
            target/reports/stdlib_total_gate.md
            target/reports/compiler_backend_surface_gate.json
            target/reports/compiler_backend_surface_gate.md
            target/reports/compiler_link_abi_gate.json
            target/reports/compiler_link_abi_gate.md
            target/reports/local_abi_manifest.json
            target/reports/selfhost_ci_regression_gate.json
            target/reports/selfhost_ci_regression_gate.md
            target/reports/selfhost_stage_hashes.json
            target/reports/selfhost_stage_hashes.sha256
            target/reports/seed_free_release_surface_gate.json
            target/reports/seed_free_release_surface_gate.md
            target/reports/selfhost_completion.md
            target/selfhost_completion/selfhost_completion.json
            target/reports/index.json
          if-no-files-found: error
