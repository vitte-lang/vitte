- title: Premier programme
  group: Premiers pas
  summary: Affiche un message et vérifie le code de sortie du programme.
  source: examples/hello.vit
  lesson: /cours/01-demarrer/
  mode: Bootstrap
  command: build/bin/vitte-bootstrap run examples/hello.vit --quiet --no-color
  result: Affiche « Hello from Vitte! » ; code de sortie 0.
