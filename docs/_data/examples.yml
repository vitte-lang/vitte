- title: Diagnostic de type attendu
  group: Résultats négatifs attendus
  summary: Passe un entier à un opérateur logique qui attend un booléen.
  source: examples/tutorials/erreur-type.vit
  lesson: /cours/11-qualite/
  mode: Échec attendu
  command: build/bin/vitte check examples/tutorials/erreur-type.vit --quiet --no-color --diagnostic=json
  result: Code de sortie 1 ; diagnostic VITTE_TYPE_E_INVALID_OPERAND.
- title: Composition générique non générée
  group: Résultats négatifs attendus
  summary: Montre que les formes génériques composées ne sont pas encore prises en charge par le backend C17.
