  command: build/bin/vitte check examples/tutorials/erreur-type.vit --quiet --no-color --diagnostic=json
  result: Code de sortie 1 ; diagnostic VITTE_TYPE_E_INVALID_OPERAND.
- title: Générique non généré
  group: Résultats négatifs attendus
  summary: Montre la différence entre une forme générique écrite et le code réellement généré.
  source: examples/tutorials/generiques-limites.vit
  lesson: /cours/10-generiques/
  mode: Échec attendu
  command: build/bin/vitte compile examples/tutorials/generiques-limites.vit --emit-c --quiet --no-color --diagnostic=json
  result: Code de sortie 1 ; diagnostic VITTE_BACKEND_E_CODEGEN.
