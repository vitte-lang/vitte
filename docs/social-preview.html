<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vitte Visual Preview</title>
  <meta name="description" content="Visual preview of the Vitte project assets.">
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { max-width: 1100px; margin: 0 auto; padding: 2rem; color: #162b45; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; }
    figure { margin: 0; padding: 1rem; border: 1px solid #d8e1e8; border-radius: 12px; }
    img { display: block; width: 100%; height: auto; }
    figcaption { margin-top: .75rem; font-weight: 600; }
  </style>
</head>
<body>
  <p><a href="index.html">Back to documentation</a></p>
  <h1>Vitte Visual Preview</h1>
  <p>Reference assets used by the project documentation and social previews.</p>
  <div class="grid">
    <figure><img src="svg/readme-hero.svg" alt="Vitte project hero"><figcaption>Main hero</figcaption></figure>
    <figure><img src="svg/readme-hero-compact.svg" alt="Compact Vitte project hero"><figcaption>Compact hero</figcaption></figure>
    <figure><img src="svg/readme-social-card.svg" alt="Vitte social card"><figcaption>Social card</figcaption></figure>
  </div>
</body>
</html>
