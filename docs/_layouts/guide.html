---
layout: default
---
<article class="reference-page">
  <div class="eyebrow"><span class="eyebrow-line"></span> DOCUMENTATION VITTE <span class="eyebrow-sep">/</span> {{ page.section }}</div>
  <header class="lesson-header">
    <h1>{{ page.title }}</h1>
    <p class="lesson-lead">{{ page.lead }}</p>
  </header>
  <nav class="reference-toc" aria-label="Sommaire de cette page" hidden>
    <strong>Sur cette page</strong>
    <ul></ul>
  </nav>
  <div class="reference-body">{{ content }}</div>
</article>
<script src="{{ '/assets/js/reference-toc.js' | relative_url }}" defer></script>
