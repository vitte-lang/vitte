# Geany snippets for the syntax defined by grammar/vitte.ebnf.
# Install: editors/geany/install_geany.sh appends these sections to snippets.conf.
# Keep [vitte] and [Vitte] synchronized.

[vitte]
space=space %cursor%;
use=use %cursor%;
use_as=use %cursor% as %cursor%;
export=export %cursor%;
export_all=export *;

proc=proc %cursor%() {\n\t%cursor%\n}
proc_return=proc %cursor%() -> %cursor% {\n\tgive %cursor%;\n}
proc_parameter=proc %cursor%(%cursor%: %cursor%) -> %cursor% {\n\t%cursor%\n}
proc_async=async proc %cursor%() {\n\t%cursor%\n}
proc_extern=extern "C" proc %cursor%(%cursor%: %cursor%);
intrinsic=intrinsic %cursor%();
macro=macro %cursor%() {\n\t%cursor%\n}
test=test %cursor% {\n\t%cursor%\n}

const=const %cursor%: %cursor% = %cursor%;
static=static %cursor%: %cursor% = %cursor%;
let=let %cursor% = %cursor%;
let_mut=let mut %cursor%: %cursor% = %cursor%;
set=set %cursor% = %cursor%;
set_add=set %cursor% += %cursor%;

type=type %cursor% = %cursor%;
opaque=opaque %cursor%;
form=form %cursor% {\n\t%cursor%: %cursor%,\n}
form_generic=form %cursor%<T> {\n\tvalue: T,\n}
pick=pick %cursor% {\n\tReady,\n\tFailed(%cursor%),\n}
trait=trait %cursor% {\n\tproc %cursor%(%cursor%: %cursor%) {\n\t\t%cursor%\n\t}\n}
impl=impl %cursor% for %cursor% {\n\t%cursor%\n}

if=if %cursor% {\n\t%cursor%\n}
if_else=if %cursor% {\n\t%cursor%\n} else {\n\t%cursor%\n}
while=while %cursor% {\n\t%cursor%\n}
loop=loop {\n\t%cursor%\n}
for=for %cursor% in %cursor% {\n\t%cursor%\n}
match=match %cursor% {\n\t%cursor% => %cursor%,\n\t_ => %cursor%,\n}

defer=defer %cursor%;
defer_block=defer {\n\t%cursor%\n}
assert=assert(%cursor%);
unsafe=unsafe {\n\t%cursor%\n}
asm=asm("%cursor%");

return=return;
return_value=return %cursor%;
give=give;
give_value=give %cursor%;

