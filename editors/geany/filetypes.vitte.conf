# Vitte language support for Geany
# Install to: ~/.config/geany/filedefs/filetypes.vitte.conf

[styling]
lexer_filetype=C

default=#111111;;false;false
comment=#0b7a0b;;false;true
commentline=#0b7a0b;;false;true
commentdoc=#0b7a0b;;false;true
number=#0a7f66;;false;false
word=#0033cc;;true;false
word2=#7a3e9d;;false;false
string=#a31515;;false;false
character=#a31515;;false;false
uuid=#0a7f66;;false;false
preprocessor=#7a3e9d;;false;false
operator=#202020;;false;false
identifier=#111111;;false;false
stringeol=#d10000;;true;false
verbatim=#a31515;;false;false
regex=#c41a16;;false;false
commentlinedoc=#0b7a0b;;false;true
word3=#1f4e79;;false;false
word4=#7a3e9d;;false;false
word5=#005a9e;;false;false
word6=#0a7f66;;false;false
word7=#8a6d1d;;false;false
word8=#333333;;false;false
commentdockeyword=#0033cc;;true;false
commentdockeyworderror=#d10000;;true;false
globalclass=#7a3e9d;;false;false

# ============================================================================
# Keywords
# ============================================================================

[keywords]

# Canonical Vitte keywords.
primary=space use export const static type opaque form pick trait impl proc extern intrinsic macro test pub async unsafe comptime where requires ensures let mut set return give break continue defer assert if else while loop for in match asm ref move await not and or self as

# Declarations and literals.
secondary=space use export const static type opaque form pick trait impl proc extern intrinsic macro test true false null

docComment=TODO FIXME BUG HACK NOTE XXX

# Built-in types.
typedefs=void never unit bool char rune str string bytes cstr int i8 i16 i32 i64 i128 isize u8 u16 u32 u64 u128 usize intptr uintptr f16 f32 f64 f128 c_char c_int c_uint c_long c_ulong c_void

# ============================================================================
# File settings
# ============================================================================

[settings]

extension=vit;vitl;vitte

wordchars=_abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789

lexer_filetype=C
tag_parser=C
symbol_list_sort_mode=1

comment_single=//
comment_open=/*
comment_close=*/
comment_use_indent=true

context_action_cmd=sh -lc 'vitte check "$1"' sh "%f"

# ============================================================================
# Indentation
# ============================================================================

[indentation]

width=2
type=1
hard_tab_width=8
detect_indent=false
detect_indent_width=false
indent_mode=2

# ============================================================================
# Build menu
# ============================================================================

[build-menu]

# --------------------------------------------------------------------------
# Current file
# --------------------------------------------------------------------------

FT_00_LB=_Check
FT_00_CM=sh -lc 'vitte check "$1"' sh "%f"
FT_00_WD=%d

FT_01_LB=_Build
FT_01_CM=sh -lc 'vitte build "$1"' sh "%f"
FT_01_WD=%d

FT_02_LB=_Run
FT_02_CM=sh -lc 'vitte run "$1"' sh "%f"
FT_02_WD=%d

FT_03_LB=_Test
FT_03_CM=sh -lc 'vitte test "$1"' sh "%f"
FT_03_WD=%d

FT_04_LB=F_ormat
FT_04_CM=sh -lc 'vitte fmt "$1"' sh "%f"
FT_04_WD=%d

FT_05_LB=_Parse
FT_05_CM=sh -lc 'vitte parse "$1"' sh "%f"
FT_05_WD=%d

# --------------------------------------------------------------------------
# Project
# --------------------------------------------------------------------------

FT_06_LB=Project _Check
FT_06_CM=sh -lc 'if [ -f Makefile ]; then make quickstart-check; else vitte check "$1"; fi' sh "%f"
FT_06_WD=%p

FT_07_LB=Project T_est
FT_07_CM=sh -lc 'if [ -f Makefile ]; then vitte test .; else vitte test "$1"; fi' sh "%f"
FT_07_WD=%p

FT_08_LB=Project F_ormat
FT_08_CM=sh -lc 'if [ -f Makefile ]; then make fmt 2>/dev/null || vitte fmt .; else vitte fmt "$1"; fi' sh "%f"
FT_08_WD=%p

FT_09_LB=Project _Clean
FT_09_CM=sh -lc 'if [ -f Makefile ]; then make clean; else echo "No Makefile in project root"; fi' sh
FT_09_WD=%p

# ============================================================================
# Extra commands
# ============================================================================

# --------------------------------------------------------------------------
# Current-file symbols
# --------------------------------------------------------------------------

EX_00_LB=_Current File Symbols
EX_00_CM=sh -lc 'grep -nE "^[[:space:]]*(proc|form|pick|trait|impl|type|opaque|intrinsic|macro|test|extern|const|static)[[:space:]]+[A-Za-z_][A-Za-z0-9_]*|^[[:space:]]*(space|use|export)[[:space:]]+[A-Za-z0-9_/:]+" "$1" || echo "No Vitte symbols detected"' sh "%f"
EX_00_WD=%d

# --------------------------------------------------------------------------
# Workspace symbols
# --------------------------------------------------------------------------

EX_01_LB=_Workspace Symbols
EX_01_CM=sh -lc 'find . -type f \( -name "*.vit" -o -name "*.vitl" -o -name "*.vitte" \) -print0 | xargs -0 grep -nHE "^[[:space:]]*(proc|form|pick|trait|impl|type|opaque|intrinsic|macro|test|extern|const|static)[[:space:]]+[A-Za-z_][A-Za-z0-9_]*|^[[:space:]]*(space|use|export)[[:space:]]+[A-Za-z0-9_/:]+" || echo "No Vitte symbols detected in workspace"' sh
EX_01_WD=%p

# --------------------------------------------------------------------------
# Diagnostics
# --------------------------------------------------------------------------

EX_02_LB=_Diagnostics
EX_02_CM=sh -lc 'vitte check "$1"' sh "%f"
EX_02_WD=%d

# --------------------------------------------------------------------------
# Package / build configuration
# --------------------------------------------------------------------------

EX_03_LB=_Package Manifest
EX_03_CM=sh -lc 'for f in vitte.pkg package.vit steelconf; do if [ -e "$f" ]; then ls -la "$f"; fi; done'
EX_03_WD=%p

# --------------------------------------------------------------------------
# Repository gates
# --------------------------------------------------------------------------

EX_04_LB=Quickstart _Check (Makefile)
EX_04_CM=sh -lc 'if [ -f Makefile ]; then make quickstart-check; else echo "No Makefile in project root"; fi' sh
EX_04_WD=%p

EX_05_LB=Core _Language Gate (Makefile)
EX_05_CM=sh -lc 'if [ -f Makefile ]; then make core-language-gate; else echo "No Makefile in project root"; fi' sh
EX_05_WD=%p

# --------------------------------------------------------------------------
# Files
# --------------------------------------------------------------------------

EX_06_LB=_List Vitte Files
EX_06_CM=sh -lc 'find . -type f \( -name "*.vit" -o -name "*.vitl" -o -name "*.vitte" \) -print | LC_ALL=C sort' sh
EX_06_WD=%p

# --------------------------------------------------------------------------
# Compiler information
# --------------------------------------------------------------------------

EX_07_LB=_Version
EX_07_CM=sh -lc 'vitte --version'
EX_07_WD=%p

EX_08_LB=_Help
EX_08_CM=sh -lc 'vitte --help'
EX_08_WD=%p

EX_09_LB=_Doctor
EX_09_CM=sh -lc 'vitte doctor'
EX_09_WD=%p

# ============================================================================
# Working-directory policy
# ============================================================================
#
# %d = current file directory
# %p = project root
# %c = current process directory
#
# File-oriented operations use %d.
# Project-oriented operations use %p.
# ============================================================================